<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI Improvements for Royal Road</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Lists</h1>

    <label class="row" for="p-expandAll">
      <input type="checkbox" id="p-expandAll" data-setting="list.expandAll" />
      <span>Expand all descriptions</span>
    </label>

    <label class="row" for="p-hoverExpand">
      <input type="checkbox" id="p-hoverExpand" data-setting="list.hoverExpand" />
      <span>Expand on hover</span>
    </label>

    <label class="row" for="p-hideEnabled">
      <input type="checkbox" id="p-hideEnabled" data-setting="hide.enabled" />
      <span>Hide fictions</span>
    </label>

    <label class="row" for="p-showHidden">
      <input type="checkbox" id="p-showHidden" data-setting="hide.showHidden" />
      <span>Show hidden in place <b id="p-count" class="count">0</b></span>
    </label>

    <label class="row row--stack" for="p-view">
      <span>Layout</span>
      <select id="p-view" class="select" data-setting="list.view"></select>
    </label>

    <h1>Reader</h1>

    <label class="row" for="p-readerEnabled">
      <input type="checkbox" id="p-readerEnabled" data-setting="reader.enabled" />
      <span>Override chapter typography</span>
    </label>

    <label class="row row--stack" for="p-lineHeight">
      <span>Line height <b id="p-lineHeight-out" class="count">-</b></span>
      <input
        type="range"
        id="p-lineHeight"
        data-setting="reader.lineHeight"
        min="1"
        max="2.6"
        step="0.05"
      />
    </label>

    <label class="row" for="p-justify">
      <input type="checkbox" id="p-justify" data-setting="reader.justify" />
      <span>Justify text</span>
    </label>

    <label class="row row--stack" for="p-maxWidth">
      <span>Reading width <b id="p-maxWidth-out" class="count">-</b></span>
      <input
        type="range"
        id="p-maxWidth"
        data-setting="reader.maxWidthPx"
        min="600"
        max="2400"
        step="20"
      />
    </label>

    <button type="button" id="p-manage" class="btn">All settings &amp; hidden fictions…</button>

    <script src="../common/browser.js"></script>
    <script src="../common/selectors.js"></script>
    <script src="../common/schema.js"></script>
    <script src="../common/model.js"></script>
    <script src="../common/store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
